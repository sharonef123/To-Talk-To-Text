# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX is required because app/build.gradle.kts depends on androidx.* artifacts
# directly; without this flag AGP refuses to build ("This project uses AndroidX
# dependencies, but the android.useAndroidX property is not enabled").
android.useAndroidX=true
android.enableJetifier=false

# Use the non-transitive R class / stable IDs for faster, more predictable builds.
android.nonTransitiveRClass=true
