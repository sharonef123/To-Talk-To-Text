name: Build Android APK

# Compiles the Android app (android/) into To-Talk-To-Text-Android.apk on every
# push and PR, and publishes it as a downloadable build artifact. On pushes to
# main/master it also cuts a GitHub Release carrying the APK, so there's always
# a direct download link without needing local Android SDK/JDK tooling.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Stage APK as release artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/To-Talk-To-Text-Android.apk
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: To-Talk-To-Text-Android
          path: dist/To-Talk-To-Text-Android.apk
          if-no-files-found: error

      - name: Create / update GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: "Android build #${{ github.run_number }}"
          body: |
            Automated APK build from commit ${{ github.sha }}.
            This is a **debug** build (unsigned, debuggable) produced by `.github/workflows/build-apk.yml`.
          files: dist/To-Talk-To-Text-Android.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
